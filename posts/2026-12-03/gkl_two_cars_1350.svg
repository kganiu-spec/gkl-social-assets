<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#f5f2ea"/><g transform="translate(78,12)" fill="#182e3c" font-family="DejaVu Sans"><text x="0" y="80" font-size="28" font-weight="bold" letter-spacing="2">GLOBAL KINGS LOGISTICS</text><path d="M0 116h920" stroke="#758086"/><text x="0" y="181" font-size="26" fill="#964c31" font-weight="bold">METHOD MATCH     /     U.S. TO LAGOS</text><text x="-3" y="310" font-size="100" font-weight="bold" letter-spacing="-4">Two cars.</text><text x="-3" y="422" font-size="100" font-weight="bold" letter-spacing="-4">One ready.</text><text x="0" y="523" font-size="48" >Ship separately or wait for both?</text><path d="M0 602h920" stroke="#758086"/><text x="0" y="670" font-size="29" fill="#964c31">01</text><text x="84" y="671" font-size="45" font-weight="bold">Move the ready car</text><text x="84" y="741" font-size="37" >Ask for the cost of two pickups</text><text x="84" y="794" font-size="37" >and separate handling.</text><path d="M0 850h920" stroke="#758086"/><text x="0" y="919" font-size="29" fill="#964c31">02</text><text x="84" y="919" font-size="45" font-weight="bold">Wait for the second car</text><text x="84" y="990" font-size="37" >Confirm its release date and what</text><text x="84" y="1043" font-size="37" >it costs to hold the first car.</text><path d="M0 1132h920" stroke="#758086"/><text x="0" y="1207" font-size="32" >Compare both plans to the same handoff point.</text></g></svg>
