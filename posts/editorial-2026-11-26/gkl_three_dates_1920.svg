<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#142B3B"/><g font-family="DejaVu Sans" transform="translate(80 215)" fill="#F6F2E9"><text x="0" y="100" font-size="27" letter-spacing="2" font-weight="bold">GLOBAL KINGS LOGISTICS</text><path d="M0 139h900" stroke="#8D999D"/><text x="0" y="215" font-size="24" fill="#E3A27C">CORRIDOR BOARD   /   U.S. CONTAINER EXPORTS</text><text x="-4" y="365" font-size="103" font-weight="bold" letter-spacing="-5">One booking.</text><text x="-4" y="484" font-size="103" font-weight="bold" letter-spacing="-5">Three dates.</text><text x="0" y="591" font-size="42" >Check all three before dispatch.</text><path d="M0 659h890" stroke="#667780"/><text x="0" y="724" font-size="32" fill="#E3A27C">01</text><text x="87" y="724" font-size="45" font-weight="bold">Receiving opens</text><text x="87" y="780" font-size="33" >First day the terminal accepts the box.</text><path d="M0 824h890" stroke="#667780"/><text x="0" y="889" font-size="32" fill="#E3A27C">02</text><text x="87" y="889" font-size="45" font-weight="bold">Gate cutoff</text><text x="87" y="945" font-size="33" >Deadline to deliver the loaded container.</text><path d="M0 989h890" stroke="#667780"/><text x="0" y="1054" font-size="32" fill="#E3A27C">03</text><text x="87" y="1054" font-size="45" font-weight="bold">Document cutoff</text><text x="87" y="1110" font-size="33" >Deadline to submit shipping instructions.</text><text x="0" y="1240" font-size="29" >Check the latest voyage and terminal notices.</text></g></svg>
